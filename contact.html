<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="nav-brand">NASARI FOUR PLA <small>나사리 포플라</small></a>
    <button class="nav-toggle" aria-label="메뉴">☰</button>
    <ul class="nav-menu">
      <li><a href="index.html">건물소개</a></li>
      <li><a href="stores/wanyeonhan.html">완연한 나사리</a></li>
      <li><a href="stores/bamai.html">바마이</a></li>
      <li><a href="stores/seoridam.html">서리담</a></li>
      <li><a href="stores/onbook.html">온북국수</a></li>
      <li><a href="contact.html">연락처</a></li>
    </ul>
  </div>
</nav>

<header class="store-hero">
  <div class="container">
    <div class="cat">CONTACT</div>
    <h1>연락처 & 문의</h1>
    <p>매장 이용, 임대·제휴, 단체 예약까지 — 편하게 문의해 주세요.</p>
  </div>
</header>

<section class="store-section">
  <div class="container">
    <div class="contact-grid">
      <div>
        <div class="sec-eyebrow">INFO</div>
        <h2 class="sec-title">기본 정보</h2>
        <dl class="info-grid">
          <dt>주소</dt><dd>울산광역시 울주군 서생면<br>나사해안길 33, 103동</dd>
          <dt>대표 문의</dt><dd>(준비 중)</dd>
          <dt>이메일</dt><dd>(준비 중)</dd>
          <dt>주변 관광지</dt><dd>간절곶 5분 · 서생포왜성 10분</dd>
        </dl>
      </div>
      <div>
        <div class="sec-eyebrow">FORM</div>
        <h2 class="sec-title">문의 양식</h2>
        <form onsubmit="event.preventDefault(); alert('문의 접수는 준비 중입니다. 이메일로 연락 부탁드립니다.');">
          <div class="form-field">
            <label for="name">이름</label>
            <input id="name" type="text" required>
          </div>
          <div class="form-field">
            <label for="contact">연락처 (이메일 또는 전화)</label>
            <input id="contact" type="text" required>
          </div>
          <div class="form-field">
            <label for="msg">문의 내용</label>
            <textarea id="msg" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="background: var(--ocean-deep); color: white;">보내기</button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">© 2026 NASARI FOUR PLA. All rights reserved.</div>
  </div>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
